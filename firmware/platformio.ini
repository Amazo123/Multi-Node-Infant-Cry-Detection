; ====================================================================
; PlatformIO Configuration for Multi-Node Infant Cry Detection System
; Target Devices:
;   - 3x Cot Sensing Nodes (ESP32-C3)
;   - 1x Central Intelligence Hub (ESP32-S3-DevKitC-1 N16R8)
;   - 1x Caregiver Wearable Wristband (ESP32-C3-MINI-1)
; ====================================================================

[platformio]
default_envs = central_hub_s3, cot_node_c3, wearable_c3
src_dir = .

[env]
platform = espressif32 @ ^6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --------------------------------------------------------------------
; 1. Central Intelligence Hub (ESP32-S3-N16R8)
; --------------------------------------------------------------------
[env:central_hub_s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
; Enable Octal PSRAM & Octal Flash support
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv
build_src_filter = 
    +<central_hub_s3/*>
    +<common/*>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Icommon
lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9

; --------------------------------------------------------------------
; 2. Cot Sensing Nodes 1, 2, 3 (ESP32-C3-DevKitC-02)
; --------------------------------------------------------------------
[env:cot_node_c3]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions_4MB.csv
build_src_filter = 
    +<node_firmware/*>
    +<common/*>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -Icommon

; --------------------------------------------------------------------
; 3. Caregiver Wearable Wristband (ESP32-C3-MINI-1)
; --------------------------------------------------------------------
[env:wearable_c3]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions_4MB.csv
build_src_filter = 
    +<wearable_firmware/*>
    +<common/*>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -Icommon
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
